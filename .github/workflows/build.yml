name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
        working-directory: AudioSplitterJUCE

      - name: Build
        run: cmake --build build --config Release --parallel
        working-directory: AudioSplitterJUCE

      - name: Verify binary (macOS)
        if: runner.os == 'macOS'
        run: ls -d "build/AudioSplitter_artefacts/Release/ZQ SFX Audio Splitter.app"
        working-directory: AudioSplitterJUCE

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        run: dir "build\AudioSplitter_artefacts\Release\ZQ SFX Audio Splitter.exe"
        working-directory: AudioSplitterJUCE

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        run: find build/AudioSplitter_artefacts -type f -executable | head -5 && test -n "$(find build/AudioSplitter_artefacts -type f -executable)"
        working-directory: AudioSplitterJUCE
